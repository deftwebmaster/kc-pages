<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaiCox.com</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 520px);
    }

    img {
      display: block;
      width: min(100%, 360px);
      aspect-ratio: 1;
      object-fit: cover;
      margin: 0 auto 28px;
      border-radius: 24px;
      box-shadow: 0 0 50px rgba(80, 180, 255, 0.18);
    }

    p {
      margin: 0;
      color: #b8b8b8;
      font-size: 1rem;
      line-height: 1.6;
    }

    a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid #555;
    }

    a:hover,
    a:focus {
      border-bottom-color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <img src="kaicox-avatar.png" alt="Abstract KaiCox emblem">
    <p>
      If you're interested in this domain, please email
      <a href="mailto:contact@KaiCox.com">contact@KaiCox.com</a>.
    </p>
  </main>
</body>
</html>
